<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagar Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7;
    --card: #fffdf8;
    --ink: #1d2a24;
    --muted: #6b766f;
    --green: #2f6b4f;
    --green-soft: #dcebe2;
    --red: #b5472f;
    --red-soft: #f6dcd4;
    --amber: #b7862a;
    --amber-soft: #f6ead0;
    --line: #e4dccb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161b18; --card: #1f2622; --ink: #eef2ee; --muted: #9aa69e;
      --green: #7cc29c; --green-soft: #22342b; --red: #e58a72; --red-soft: #3a2620;
      --amber: #e0b567; --amber-soft: #3a3020; --line: #2e3832;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Hind', system-ui, sans-serif; font-size: 16px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 96px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0; font-weight: 700; }
  .month-ctrl { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 8px; padding: 8px 12px; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.ghost { background: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button { flex: 1; }
  .tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-weight: 600; font-size: 17px; }
  .sub { color: var(--muted); font-size: 14px; }
  .status { display: flex; gap: 6px; }
  .status button { padding: 6px 10px; min-width: 44px; font-weight: 600; }
  .status button.p.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .status button.h.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .status button.a.on { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .form { display: grid; gap: 8px; margin-bottom: 16px; }
  input, select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); width: 100%; }
  .total { font-size: 20px; font-weight: 700; }
  .paid { color: var(--green); font-weight: 600; }
  .due { color: var(--red); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }
  .tiny { font-size: 13px; padding: 6px 8px; }
  .hide { display: none !important; }
  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pagar Lite</h1>
    <div class="month-ctrl no-print">
      <button class="ghost" id="prev" aria-label="Pichla mahina">&larr;</button>
      <span id="monthLabel"></span>
      <button class="ghost" id="next" aria-label="Agla mahina">&rarr;</button>
    </div>
  </header>

  <nav class="tabs no-print">
    <button id="tabAtt" class="on">Attendance</button>
    <button id="tabSal">Salary</button>
    <button id="tabStaff">Staff</button>
  </nav>

  <!-- Attendance -->
  <section id="viewAtt">
    <div class="form no-print" style="grid-template-columns: 1fr auto;">
      <select id="dayPick"></select>
      <button class="ghost" id="markAll">Sab present</button>
    </div>
    <div id="attList"></div>
  </section>

  <!-- Salary -->
  <section id="viewSal" class="hide">
    <div id="salList"></div>
  </section>

  <!-- Staff -->
  <section id="viewStaff" class="hide">
    <form id="staffForm" class="form no-print">
      <input id="sName" placeholder="Naam" required>
      <input id="sPhone" placeholder="Phone number" inputmode="tel">
      <select id="sType">
        <option value="daily">Daily wage (rozana)</option>
        <option value="monthly">Monthly salary (mahina)</option>
      </select>
      <input id="sRate" type="number" min="0" placeholder="Rate (rupaye)" required>
      <button class="primary" type="submit">Staff add karein</button>
    </form>
    <div id="staffList"></div>
  </section>
</div>

<script>
const KEY = 'pagar-lite-v1';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || { staff: [], att: {}, paid: {} };
let view = 'att';
let cursor = new Date(); cursor.setDate(1);

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const monthName = d => d.toLocaleDateString('hi-IN', { month: 'long', year: 'numeric' });
const daysIn = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const rupee = n => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function dayKey(staffId, day) { return ym(cursor) + '-' + String(day).padStart(2, '0') + '|' + staffId; }
function statusOf(staffId, day) { return state.att[dayKey(staffId, day)] || ''; }
function presentDays(staffId) {
  let total = 0;
  for (let d = 1; d <= daysIn(cursor); d++) {
    const s = statusOf(staffId, d);
    if (s === 'p') total += 1; else if (s === 'h') total += 0.5;
  }
  return total;
}
function earned(s) {
  const days = presentDays(s.id);
  if (s.type === 'daily') return days * s.rate;
  const workingDays = daysIn(cursor);
  return (days / workingDays) * s.rate;
}
function paidKey(staffId) { return ym(cursor) + '|' + staffId; }

function renderMonth() { $('monthLabel').textContent = monthName(cursor); }

function renderDayPick() {
  const sel = $('dayPick');
  const today = new Date();
  const isThisMonth = ym(today) === ym(cursor);
  sel.innerHTML = '';
  for (let d = 1; d <= daysIn(cursor); d++) {
    const o = document.createElement('option');
    o.value = d;
    o.textContent = d + ' ' + cursor.toLocaleDateString('hi-IN', { month: 'short' });
    if (isThisMonth && d === today.getDate()) o.selected = true;
    sel.appendChild(o);
  }
}

function renderAtt() {
  const day = +$('dayPick').value || 1;
  const list = $('attList');
  if (!state.staff.length) { list.innerHTML = '<div class="empty">Pehle "Staff" tab mein log add karein.</div>'; return; }
  list.innerHTML = state.staff.map(s => {
    const st = statusOf(s.id, day);
    return `<div class="card row">
      <div><div class="name">${esc(s.name)}</div><div class="sub">${s.type === 'daily' ? rupee(s.rate) + ' / din' : rupee(s.rate) + ' / mahina'}</div></div>
      <div class="status">
        <button class="p ${st==='p'?'on':''}" data-id="${s.id}" data-st="p" aria-label="Present">P</button>
        <button class="h ${st==='h'?'on':''}" data-id="${s.id}" data-st="h" aria-label="Half day">H</button>
        <button class="a ${st==='a'?'on':''}" data-id="${s.id}" data-st="a" aria-label="Absent">A</button>
      </div></div>`;
  }).join('');
}

function renderSal() {
  const list = $('salList');
  if (!state.staff.length) { list.innerHTML = '<div class="empty">Abhi koi staff nahi hai.</div>'; return; }
  list.innerHTML = state.staff.map(s => {
    const amt = earned(s);
    const paid = !!state.paid[paidKey(s.id)];
    const days = presentDays(s.id);
    const wa = encodeURIComponent(`${s.name} ka ${monthName(cursor)} ka salary: ${rupee(amt)} (${days} din present)`);
    return `<div class="card">
      <div class="row"><div class="name">${esc(s.name)}</div><div class="total">${rupee(amt)}</div></div>
      <div class="row" style="margin-top:6px">
        <div class="sub">${days} din present</div>
        <div class="${paid ? 'paid' : 'due'}">${paid ? 'Paid' : 'Baaki'}</div>
      </div>
      <div class="row no-print" style="margin-top:8px; justify-content:flex-start; gap:6px">
        <button class="tiny" data-pay="${s.id}">${paid ? 'Unpaid karein' : 'Paid mark karein'}</button>
        <a class="tiny" style="text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:6px 8px; color:var(--ink); background:var(--card)" href="https://wa.me/${(s.phone||'').replace(/\D/g,'')}?text=${wa}" target="_blank" rel="noopener">WhatsApp par bhejein</a>
      </div></div>`;
  }).join('');
}

function renderStaff() {
  const list = $('staffList');
  if (!state.staff.length) { list.innerHTML = '<div class="empty">Abhi koi staff nahi hai.</div>'; return; }
  list.innerHTML = state.staff.map(s => `<div class="card row">
    <div><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.phone || 'Phone nahi')} · ${s.type === 'daily' ? 'Daily' : 'Monthly'} ${rupee(s.rate)}</div></div>
    <button class="ghost tiny" data-del="${s.id}" aria-label="Hatayein">Hatayein</button>
  </div>`).join('');
}

function renderAll() {
  renderMonth(); renderDayPick(); renderAtt(); renderSal(); renderStaff();
  save();
}

function showView(v) {
  view = v;
  ['Att','Sal','Staff'].forEach(n => {
    $('view' + n).classList.toggle('hide', n.toLowerCase() !== v && !(v === 'att' && n === 'Att') && !(v === 'sal' && n === 'Sal') && !(v === 'staff' && n === 'Staff'));
  });
  $('tabAtt').classList.toggle('on', v === 'att');
  $('tabSal').classList.toggle('on', v === 'sal');
  $('tabStaff').classList.toggle('on', v === 'staff');
}

$('tabAtt').onclick = () => showView('att');
$('tabSal').onclick = () => { showView('sal'); renderSal(); };
$('tabStaff').onclick = () => { showView('staff'); renderStaff(); };
$('prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); renderAll(); };
$('next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); renderAll(); };
$('dayPick').onchange = renderAtt;

$('attList').onclick = e => {
  const b = e.target.closest('button[data-st]');
  if (!b) return;
  const day = +$('dayPick').value;
  const key = dayKey(b.dataset.id, day);
  const cur = state.att[key];
  if (cur === b.dataset.st) delete state.att[key]; else state.att[key] = b.dataset.st;
  renderAll();
};

$('markAll').onclick = () => {
  const day = +$('dayPick').value;
  state.staff.forEach(s => { state.att[dayKey(s.id, day)] = 'p'; });
  renderAll();
};

$('salList').onclick = e => {
  const b = e.target.closest('button[data-pay]');
  if (!b) return;
  const k = paidKey(b.dataset.pay);
  if (state.paid[k]) delete state.paid[k]; else state.paid[k] = true;
  renderAll();
};

$('staffForm').onsubmit = e => {
  e.preventDefault();
  state.staff.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: $('sName').value.trim(),
    phone: $('sPhone').value.trim(),
    type: $('sType').value,
    rate: +$('sRate').value
  });
  e.target.reset();
  renderAll();
  showView('att');
};

$('staffList').onclick = e => {
  const b = e.target.closest('button[data-del]');
  if (!b) return;
  if (!confirm('Is staff ko hata dein?')) return;
  const id = b.dataset.del;
  state.staff = state.staff.filter(s => s.id !== id);
  Object.keys(state.att).forEach(k => { if (k.endsWith('|' + id)) delete state.att[k]; });
  renderAll();
};

renderAll();
showView('att');
</script>
</body>
</html>
